<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#18181b">
<title>RENDA EXTRA DT — Dashboard</title>
<style>
:root{
  --bg:#f6f7f8;--card:#fff;--ink:#18181b;--muted:#71717a;--line:#e4e4e7;
  --green:#047857;--green-bg:#ecfdf5;--red:#b91c1c;--red-bg:#fef2f2;
  --blue:#1d4ed8;--blue-bg:#eff6ff;--amber:#b45309;--dark:#18181b;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:1120px;margin:auto;padding:24px 16px 48px}
.badge{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 12px;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:#10b981}
h1{font-size:36px;letter-spacing:-.045em;margin:14px 0 4px}
.sub{color:var(--muted);font-size:14px;line-height:1.55}
.hero{margin-top:20px;background:var(--dark);color:#fff;border-radius:22px;padding:24px}
.hero-grid{display:grid;grid-template-columns:1.25fr .75fr;gap:20px;align-items:end}
.label{font-size:10px;text-transform:uppercase;letter-spacing:.12em;font-weight:800;color:#a1a1aa}
.big{font-size:34px;font-weight:850;letter-spacing:-.045em;margin-top:6px}
.hero p{color:#a1a1aa;font-size:13px;margin:8px 0 0;line-height:1.5}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.card,.panel,.callout,.table-wrap{background:var(--card);border:1px solid var(--line);border-radius:18px}
.card,.panel{padding:18px}
.card h3,.panel h3{margin:0;font-size:13px;color:#3f3f46}
.value{font-size:27px;font-weight:850;letter-spacing:-.04em;margin-top:8px}
.note{font-size:12px;color:var(--muted);line-height:1.5;margin-top:7px}
.green{color:var(--green)}.red{color:var(--red)}.blue{color:var(--blue)}.amber{color:var(--amber)}
.callout{margin-top:14px;padding:18px}
.callout.green-bg{background:var(--green-bg);border-color:#bbf7d0}
.callout.blue-bg{background:var(--blue-bg);border-color:#bfdbfe}
.callout b{font-size:17px}
.callout p{margin:7px 0 0;font-size:13px;color:#3f3f46;line-height:1.55}
.table-wrap{margin-top:14px;overflow:hidden}
.table-head{padding:18px}
.table-head h3{margin:0;font-size:15px}
.table-head p{margin:5px 0 0;color:var(--muted);font-size:12px}
.scroll{overflow:auto}
table{width:100%;border-collapse:collapse;min-width:760px}
th,td{padding:10px 12px;border-top:1px solid #f0f0f1;font-size:12px;text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:9px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);background:#fafafa}
tfoot td{font-weight:850;background:#fafafa}
footer{text-align:center;color:#a1a1aa;font-size:11px;line-height:1.5;margin-top:20px}
.loading{padding:28px;text-align:center;color:var(--muted)}
@media(max-width:860px){.hero-grid,.grid4,.grid2{grid-template-columns:1fr}h1{font-size:30px}.big{font-size:30px}}
</style>
</head>
<body>
<main>
  <div class="badge"><span class="dot"></span><span id="updatedBadge">Carregando...</span></div>
  <h1>Dashboard RENDA EXTRA DT</h1>
  <div class="sub">Caixa particular, caixa da empresa, resultado operacional e controle fiscal em visões separadas.</div>

  <div id="app" class="loading">Carregando dados do dashboard...</div>
  <footer>RENDA EXTRA DT • Primeiro sobreviver. Depois repetir. Depois escalar.</footer>
</main>

<script>
const brl = v => new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v);
const signed = v => (v>=0?'+':'') + brl(v);
const cls = v => v>0?'green':v<0?'red':'';

async function load(){
  const r = await fetch('./data.json?ts=' + Date.now(), {cache:'no-store'});
  if(!r.ok) throw new Error('Falha ao carregar dados');
  const d = await r.json();
  document.getElementById('updatedBadge').textContent = 'Atualizado • ' + d.updated_at;
  document.getElementById('app').className='';
  document.getElementById('app').innerHTML = `
    <section class="hero">
      <div class="hero-grid">
        <div>
          <div class="label">Saldo total disponível</div>
          <div class="big">${brl(d.cash.total)}</div>
          <p><b>Particular:</b> ${brl(d.cash.personal)} • <b>Empresa:</b> ${brl(d.cash.company_total)}</p>
        </div>
        <div style="text-align:right">
          <div class="label">Último pregão oficial • ${d.trading.last_day.date}</div>
          <div class="big green">${signed(d.trading.last_day.net)}</div>
          <p>Bruto ${brl(d.trading.last_day.gross)} • custos + IRRF ${brl(d.trading.last_day.costs_irrf)}</p>
        </div>
      </div>
    </section>

    <section class="callout green-bg">
      <b>💰 Caixa atualizado</b>
      <p>Após os gastos particulares de 26/09, o saldo particular é <b>${brl(d.cash.personal)}</b> e o total geral é <b>${brl(d.cash.total)}</b>.</p>
    </section>

    <section class="grid4">
      <div class="card"><h3>Particular</h3><div class="value">${brl(d.cash.personal)}</div><div class="note">Saldo particular atual.</div></div>
      <div class="card"><h3>Empresa no Nubank</h3><div class="value">${brl(d.cash.company_nubank)}</div><div class="note">Parcela da empresa dentro do Nubank.</div></div>
      <div class="card"><h3>Empresa na corretora</h3><div class="value">${brl(d.cash.company_broker)}</div><div class="note">Saldo após a nota oficial de 25/09.</div></div>
      <div class="card"><h3>Empresa total</h3><div class="value">${brl(d.cash.company_total)}</div><div class="note">Nubank + corretora.</div></div>
    </section>

    <section class="grid2">
      <div class="panel">
        <h3>Saldo total atribuído ao Nubank</h3>
        <div class="value">${brl(d.cash.nubank_total)}</div>
        <div class="note">${brl(d.cash.personal)} particular + ${brl(d.cash.company_nubank)} empresa.</div>
      </div>
      <div class="panel">
        <h3>Resultado acumulado do trading</h3>
        <div class="value ${cls(d.trading.accumulated_net)}">${signed(d.trading.accumulated_net)}</div>
        <div class="note">Resultado líquido oficial acumulado de 15 a 25/09.</div>
      </div>
    </section>

    <section class="callout blue-bg">
      <b>🧾 IRRF e DARF — Setembro/2026</b>
      <p>Resultado fiscal acumulado: <b class="${cls(d.tax.fiscal_result)}">${signed(d.tax.fiscal_result)}</b> • IRRF acumulado: <b>${brl(d.tax.irrf_credit)}</b> • IR devido: <b>${brl(d.tax.ir_due)}</b> • DARF 6015: <b>${brl(d.tax.darf)}</b>.</p>
    </section>

    <section class="grid4">
      <div class="card"><h3>Resultado fiscal</h3><div class="value ${cls(d.tax.fiscal_result)}">${signed(d.tax.fiscal_result)}</div></div>
      <div class="card"><h3>IRRF acumulado</h3><div class="value blue">${brl(d.tax.irrf_credit)}</div></div>
      <div class="card"><h3>IR devido</h3><div class="value green">${brl(d.tax.ir_due)}</div></div>
      <div class="card"><h3>DARF 6015</h3><div class="value green">${brl(d.tax.darf)}</div></div>
    </section>

    <section class="table-wrap">
      <div class="table-head"><h3>Movimentações particulares</h3><p>Histórico recente, separado do caixa da empresa.</p></div>
      <div class="scroll">
        <table>
          <thead><tr><th>Data</th><th>Descrição</th><th>Valor</th><th>Saldo particular após</th></tr></thead>
          <tbody>
            ${d.personal_movements.map(x=>`<tr><td>${x.date}</td><td>${x.description}</td><td class="${cls(x.amount)}">${signed(x.amount)}</td><td>${brl(x.balance_after)}</td></tr>`).join('')}
          </tbody>
        </table>
      </div>
    </section>

    <section class="table-wrap">
      <div class="table-head"><h3>Balanço oficial do trading</h3><p>Notas conciliadas até 25/09/2026.</p></div>
      <div class="scroll">
        <table>
          <thead><tr><th>Data</th><th>Bruto</th><th>Custos + IRRF</th><th>Líquido</th><th>Acumulado</th></tr></thead>
          <tbody>
            ${d.trading.days.map(x=>`<tr><td>${x.date}</td><td class="${cls(x.gross)}">${signed(x.gross)}</td><td>${brl(x.costs_irrf)}</td><td class="${cls(x.net)}">${signed(x.net)}</td><td class="${cls(x.acc)}">${signed(x.acc)}</td></tr>`).join('')}
          </tbody>
          <tfoot><tr><td>Total</td><td class="${cls(d.trading.total_gross)}">${signed(d.trading.total_gross)}</td><td>${brl(d.trading.total_costs_irrf)}</td><td class="${cls(d.trading.accumulated_net)}">${signed(d.trading.accumulated_net)}</td><td class="${cls(d.trading.accumulated_net)}">${signed(d.trading.accumulated_net)}</td></tr></tfoot>
        </table>
      </div>
    </section>
  `;
}
load().catch(err=>{
  document.getElementById('app').innerHTML='<div class="callout"><b>Erro ao carregar o dashboard</b><p>'+err.message+'</p></div>';
});
</script>
</body>
</html>
