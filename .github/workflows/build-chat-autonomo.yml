name: Build Vitão Assistente APK

on:
  push:
    branches: [chat-autonomo-ollama]
    paths:
      - '.github/workflows/build-chat-autonomo.yml'
      - '.github/chat-autonomo/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Reconstruir projeto
        shell: bash
        run: |
          cat .github/chat-autonomo/archive.part-* | tr -d '\n\r ' | base64 -d > projeto.zip
          unzip -t projeto.zip
          mkdir -p chat-autonomo
          unzip -q projeto.zip -d chat-autonomo

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar plataforma Android
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Compilar APK
        working-directory: chat-autonomo
        run: gradle --no-daemon assembleDebug

      - name: Preparar arquivos
        run: |
          cp chat-autonomo/app/build/outputs/apk/debug/app-debug.apk Vitao-Assistente-Local.apk
          cp projeto.zip Vitao-Assistente-Local-Fonte.zip

      - name: Publicar APK e fonte
        uses: actions/upload-artifact@v4
        with:
          name: Vitao-Assistente-Local
          path: |
            Vitao-Assistente-Local.apk
            Vitao-Assistente-Local-Fonte.zip
          if-no-files-found: error
          retention-days: 30
